version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: civiclink-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: citizenconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: civiclink-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/citizenconnect?schema=public
      - JWT_SECRET=super-secret-key-for-jwt-access-tokens-12345!
      - JWT_REFRESH_SECRET=super-secret-key-for-jwt-refresh-tokens-98765!
      - CLIENT_URL=http://localhost:3000
      # Cloudinary and OpenAI keys must be set in your host environment or .env file
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres

volumes:
  postgres_data:
